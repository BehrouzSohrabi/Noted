<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Microphone Permission</title>
	<link rel="stylesheet" href="styles.css" />
</head>

<body>
	<main>
		<section class="permission-preview">
			<p id="permission-status">Requesting microphone access...</p>
		</section>
		<section class="permission-content">
			<img src="../assets/icons/icon.png" alt="Noted" />
			<h1>Allow Microphone Access</h1>
			<p>Noted uses the browser's built-in speech-to-text feature for Dictate.</p>
			<p class="hint">Choose <strong>Allow while visiting the site</strong> in the browser permission prompt to enable it.<br />This window will close automatically once permission is granted.</p>
		</section>
	</main>
	<script src="request-microphone.js"></script>
</body>

</html>
